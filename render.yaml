services:
  # =========================================================================
  # Unified Full-Stack Service: Frontend (Next.js) + Backend (FastAPI) together
  # Pure embedded zero-setup database (SQLite) - No MongoDB needed!
  # =========================================================================
  - type: web
    name: the-midnight-steeper
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: SQLITE_DB_PATH
        value: midnight_steeper.db
      - key: BREW_DURATION_SECONDS
        value: 15
      # No API keys required. Gemma runs via Ollama when reachable; otherwise the
      # built-in lore writer and rule-based rarity model keep the game fully working.
      - key: OLLAMA_HOST
        value: ""
      - key: TEMPORAL_HOST
        value: localhost:7233
      - key: TEMPORAL_TASK_QUEUE
        value: MIDNIGHT_STEEPER_TASK_QUEUE
